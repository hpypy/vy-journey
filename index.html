<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành Trình Của Vy</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fff0f5, #ffe6f0);
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
    }


    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3em;
      color: #ff5e99;
      margin-bottom: 30px;
      animation: fadeInDown 1s ease forwards;
    }

    .stage-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      animation: fadeInUp 1s ease forwards;
    }

    .character-area {
      height: 250px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: url('https://imgur.com/pPJemTN') center/cover no-repeat;
      position: relative;
    }

    .character-area img {
      height: 160px;
      animation: float 3s ease-in-out infinite;
    }

    .confetti {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes fadeInDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .dialogue {
      padding: 20px;
      text-align: center;
    }

   .dialogue img {
  max-width: 100%;
  height: auto;
  max-height: 250px;
  border-radius: 10px;
  margin-bottom: 10px;
  transition: transform 0.4s ease;
}


    .dialogue p {
      font-size: 1.1em;
      color: #333;
      font-family: 'Dancing Script', cursive;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .controls button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff69b4;
      color: white;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.3s;
    }

    .controls button:hover {
      background-color: #ff3399;
      transform: scale(1.05);
    }

    audio {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Hành Trình Của Vy</h1>
    <div class="stage-container">
      <div class="character-area">
        <img id="character-img" src="https://i.imgur.com/pPJemTN.png" alt="Vy chibi">
        <canvas class="confetti" id="confetti-canvas"></canvas>
      </div>
      <div class="dialogue">
        <img id="stage-img" src="" alt="Kỷ niệm">
        <p id="stage-text"></p>
        <audio id="stage-audio" controls></audio>
      </div>
    </div>
    <div class="controls">
      <button id="prev-btn">⬅️ Trước</button>
      <button id="next-btn">Tiếp ➡️</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const stages = [
            {
        image: 'https://i.imgur.com/LmAX6OH.png',
        music: 'https://cdn.pixabay.com/download/audio/2023/10/26/audio_6c16fd3896.mp3?filename=nhac-chuong-noi-tinh-yeu-bat-dau-bui-anh-tuan-327395.mp3',
        message: 'Ngày 15/04/2000, một ngôi sao nhỏ tên Hà Vy ra đời. Cảm ơn mẹ Tuyến đã mang em đến, để một ngày anh được gặp em.'
      },
      {
        image: 'https://i.imgur.com/FTdLc70.png',
        music: 'https://cdn.pixabay.com/download/audio/2023/10/26/audio_3f7e724f3c.mp3?filename=niem-tin-chien-thang-my-tam-327398.mp3',
        message: 'Vy xíu xíu tung tăng khám phá thế giới, với nụ cười làm sáng cả bầu trời. Mỗi bước chân em đều dẫn gần hơn đến anh.'
      },
      {
        image: 'https://i.imgur.com/RK4uZBs.png',
        music: 'https://cdn.pixabay.com/download/audio/2023/10/26/audio_00c577a637.mp3?filename=den-ft-linh-cao-dua-nhau-di-tron-327396.mp3',
        message: 'Khuyết điểm của bé nhiều như sao trên trời ý, nhưng nụ cười của bé thì như mặt trời. Vì khi mặt trời xuất hiện cũng là lúc những ngôi sao biến mất'
      },
      {
        image: 'https://i.imgur.com/Wv3a0Lz.png',
        music: 'https://cdn.pixabay.com/download/audio/2023/10/26/audio_53a35baad2.mp3?filename=noiaycontimve-hoquanghieu-327397.mp3',
        message: 'Sinh nhật em, và cũng là ngày anh cảm ơn vì được gặp em. Vy ơi, anh yêu em, mãi mãi.'
      }

    ];

    let currentStage = 0;
    const stageImg = document.getElementById('stage-img');
    const stageText = document.getElementById('stage-text');
    const stageAudio = document.getElementById('stage-audio');
    const confettiCanvas = document.getElementById('confetti-canvas');

    function renderStage(index) {
      const stage = stages[index];
      stageImg.src = stage.image;
      stageText.textContent = '';
      stageAudio.src = stage.music;
      stageAudio.play();
      typeEffect(stage.message);
      if (index === stages.length - 1) {
        confetti({
          particleCount: 150,
          spread: 100,
          origin: { y: 0.6 },
          ticks: 200,
          scalar: 1.2,
          disableForReducedMotion: true,
        });
      }
    }

    function typeEffect(text) {
      let i = 0;
      const speed = 40;
      stageText.innerHTML = '';
      function type() {
        if (i < text.length) {
          stageText.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, speed);
        }
      }
      type();
    }

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentStage < stages.length - 1) {
        currentStage++;
        renderStage(currentStage);
      }
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentStage > 0) {
        currentStage--;
        renderStage(currentStage);
      }
    });

    renderStage(currentStage);
  </script>
</body>
</html>

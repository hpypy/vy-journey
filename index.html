<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hành Trình Của Vy</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #fff0f5, #ffe6f0);
      font-family: 'Arial', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 2.2em;
      color: #ff5e99;
      margin: 20px 0 10px;
      text-align: center;
    }
    .path {
      position: relative;
      width: 95vw;
      max-width: 500px;
      height: 80px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin: 10px auto;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 20px;
    }
    .stage-dot {
      width: 16px;
      height: 16px;
      background-color: #ff69b4;
      border-radius: 50%;
    }
    .character {
      position: absolute;
      top: -40px;
      transform: translateX(-50%);
      width: 45px;
      height: 45px;
      background-image: url('https://i.imgur.com/pPJemTN.png');
      background-size: cover;
      transition: left 1s ease;
    }
    .dialogue {
      max-width: 480px;
      width: 90vw;
      text-align: center;
      padding: 0 10px;
    }
    .dialogue img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .dialogue p {
      font-family: 'Dancing Script', cursive;
      font-size: 1.1em;
      color: #333;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .controls button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff69b4;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .controls button:hover {
      background-color: #ff3399;
    }
    @media screen and (max-width: 480px) {
      .character {
        width: 36px;
        height: 36px;
      }
      h1 {
        font-size: 1.8em;
      }
      .controls button {
        font-size: 14px;
        padding: 7px 12px;
      }
    }
  </style>
</head>
<body>
  <h1>Hành Trình Của Vy</h1>
  <div class="path">
    <div class="character" id="character"></div>
    <div class="stage-dot" data-position="25%"></div>
    <div class="stage-dot" data-position="45%"></div>
    <div class="stage-dot" data-position="65%"></div>
    <div class="stage-dot" data-position="85%"></div>
  </div>
  <div class="dialogue">
    <img id="stage-img" src="" alt="">
    <p id="stage-msg"></p>
    <audio id="stage-audio" controls></audio>
  </div>
  <div class="controls">
    <button id="prev-btn">⬅️ Trước</button>
    <button id="next-btn">Tiếp ➡️</button>
  </div>

  <script>
    const stages = [
      {
        image: 'https://i.imgur.com/LmAX6OH.png',
        music: 'https://raw.githubusercontent.com/hpypy/vy-journey/main/NoiAyConTimVe-HoQuangHieu.mp3',
        message: 'Ngày 15/04/2000, một ngôi sao nhỏ tên Hà Vy ra đời. Cảm ơn mẹ Tuyến đã mang em đến, để một ngày anh được gặp em.',
        position: '25%'
      },
      {
        image: 'https://i.imgur.com/FTdLc70.png',
        music: 'https://raw.githubusercontent.com/hpypy/vy-journey/main/niem-tin-chien-thang-my-tam.mp3',
        message: 'Vy xíu xíu tung tăng khám phá thế giới, với nụ cười làm sáng cả bầu trời. Mỗi bước chân em đều dẫn gần hơn đến anh.',
        position: '45%'
      },
      {
        image: 'https://i.imgur.com/RK4uZBs.png',
        music: 'https://raw.githubusercontent.com/hpypy/vy-journey/main/den-ft-linh-cao-dua-nhau-di-tron.mp3',
        message: 'Khuyết điểm của bé nhiều như sao trên trời ý, nhưng nụ cười của bé thì như mặt trời. Vì khi mặt trời xuất hiện cũng là lúc những ngôi sao biến mất',
        position: '65%'
      },
      {
        image: 'https://i.imgur.com/Wv3a0Lz.png',
        music: 'https://raw.githubusercontent.com/hpypy/vy-journey/main/nhac-chuong-noi-tinh-yeu-bat-dau-bui-anh-tuan.mp3',
        message: 'Sinh nhật em, và cũng là ngày anh cảm ơn vì được gặp em. Vy ơi, anh yêu em, mãi mãi.',
        position: '85%'
      }
    ];

    let currentStage = 0;
    const character = document.getElementById('character');
    const img = document.getElementById('stage-img');
    const msg = document.getElementById('stage-msg');
    const audio = document.getElementById('stage-audio');
    const nextBtn = document.getElementById('next-btn');

    function typeEffect(text) {
      let i = 0;
      msg.innerHTML = '';
      msg.style.fontFamily = "'Dancing Script', cursive";
      function typing() {
        if (i < text.length) {
          msg.innerHTML += text.charAt(i);
          i++;
          setTimeout(typing, 30);
        } else if (currentStage === stages.length - 1) {
          const extra = document.createElement('p');
          extra.textContent = '🎂 Happy Birthday My Queen 🎉';
          extra.style.fontFamily = "'Dancing Script', cursive";
          extra.style.fontSize = '1.3em';
          extra.style.color = '#ff3399';
          extra.style.marginTop = '10px';
          msg.parentNode.appendChild(extra);
          nextBtn.style.display = 'none';
        }
      }
      typing();
    }

    function renderStage(index) {
      const stage = stages[index];
      character.style.left = stage.position;
      img.src = stage.image;
      audio.src = stage.music;
      audio.play();
      typeEffect(stage.message);
    }

    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentStage < stages.length - 1) {
        currentStage++;
        renderStage(currentStage);
      }
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentStage > 0) {
        currentStage--;
        const existing = document.querySelector('.dialogue p:last-of-type');
        if (existing && existing.textContent.includes('Happy Birthday')) {
          existing.remove();
          nextBtn.style.display = 'inline-block';
        }
        renderStage(currentStage);
      }
    });

    renderStage(currentStage);
  </script>
</body>
</html>
